{% extends 'base.html' %}

{% block title %}Sign Up - Tasky{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="card-header">
        <h3 class="mb-0">Join the club! 🎉</h3>
        <p class="text-muted mt-2 mb-0" style="font-size: 1.05rem;">Create an account to start organizing your life.</p>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.signup') }}">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
                </div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Minimum 6 characters">
                </div>
            </div>
            <div class="mb-4">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Confirm your password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Sign Up</button>
        </form>
    </div>
    <div class="card-footer text-center border-0 pb-4 pt-0" style="background-color: transparent;">
        <p class="mb-0 text-muted">Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Log in</a></p>
    </div>
</div>
{% endblock %}
