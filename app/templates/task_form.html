{% extends 'base.html' %}

{% block title %}{{ title }} - Tasky{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-8 col-lg-6">
        <div class="card" style="border: 3px solid var(--border-color); border-radius: 24px; box-shadow: 8px 8px 0px rgba(43, 43, 43, 0.1); background: var(--card-bg); overflow: hidden;">
            <div class="card-header bg-white pt-4 pb-3" style="border-bottom: 2px dashed #e0ddd5;">
                <div class="d-flex justify-content-between align-items-center">
                    <h3 class="mb-0">{{ title }} ✏️</h3>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Nevermind
                    </a>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% if task %}{{ url_for('main.edit_task', task_id=task.id) }}{% else %}{{ url_for('main.new_task') }}{% endif %}">
                    <div class="mb-3">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold" style="font-family: 'Outfit', sans-serif; font-size: 1.1rem;">What do you want to do? <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" required 
                               value="{{ task.title if task else '' }}" placeholder="e.g. Buy groceries, conquer the world...">
                    </div>
                    
                    <div class="mb-3">
                        <label for="description" class="form-label fw-bold" style="font-family: 'Outfit', sans-serif; font-size: 1.1rem;">Any details?</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  placeholder="Scribble down your notes here...">{{ task.description if task else '' }}</textarea>
                    </div>
                    
                    <div class="mb-4">
                    <div class="mb-4">
                        <label for="status" class="form-label fw-bold" style="font-family: 'Outfit', sans-serif; font-size: 1.1rem;">How's it going?</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Pending" {% if task and task.status == 'Pending' %}selected{% endif %}>Pending</option>
                            <option value="In Progress" {% if task and task.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="Completed" {% if task and task.status == 'Completed' %}selected{% endif %}>Completed</option>
                        </select>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save"></i> {% if task %}Update Task{% else %}Save Task{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
