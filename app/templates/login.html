{% extends 'base.html' %}

{% block title %}Log In - Tasky{% endblock %}

{% block content %}
<div class="card auth-card">
    <div class="card-header">
        <h3 class="mb-0">Welcome back! 👋</h3>
        <p class="text-muted mt-2 mb-0" style="font-size: 1.05rem;">We've missed you. Let's get things done.</p>
    </div>
    <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter your password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log In</button>
        </form>
    </div>
    <div class="card-footer text-center border-0 pb-4 pt-0" style="background-color: transparent;">
        <p class="mb-0 text-muted">New here? <a href="{{ url_for('auth.signup') }}" style="color: var(--primary-color); font-weight: 700; text-decoration: none;">Create an account</a></p>
    </div>
</div>
{% endblock %}
